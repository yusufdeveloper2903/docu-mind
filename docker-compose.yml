# PostgreSQL 17 with pgvector for local development:
#   docker compose up -d
# then use DATABASE_URL=postgres://postgres:postgres@localhost:5432/documind (see .env.example).
services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: documind
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d documind"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
